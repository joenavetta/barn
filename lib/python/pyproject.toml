[project]
name = "barn"
version = "0.1.0"
description = "Helpers for the barn home infrastructure repo"
requires-python = ">=3.11"
dependencies = [
  "onepassword-sdk>=0.4.2,<0.5",
  "cryptography>=43",
  "shtab>=1.7",
]

[project.scripts]
barn-cf = "barn.cf.cli:main"
barn-op = "barn.op.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barn"]
